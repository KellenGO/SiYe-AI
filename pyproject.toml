[project]
name = "siye-ai"
version = "1.1.0"
description = "Optional SiYe research assistant"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "parsel==1.9.1", "claude-agent-sdk==0.2.163"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pyinstaller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
