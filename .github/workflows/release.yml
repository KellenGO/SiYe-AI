name: Build AI extension
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync --frozen
      - run: uv run pytest tests -q
      - run: npm ci
        working-directory: webui
      - run: uv run python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: SiYe-AI-Windows-x64
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/SiYe-AI-Windows-x64.zip dist/SiYe-AI-Windows-x64.zip.sha256 --title "四野 AI $env:GITHUB_REF_NAME" --generate-notes
